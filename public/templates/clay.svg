<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <!-- Background pastel cream gradient -->
    <linearGradient id="clayBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4eee3"/>
    </linearGradient>

    <!-- Yellow organic fluid blob gradient -->
    <linearGradient id="blobYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Glossy 3D Quotation Mark Yellow -->
    <linearGradient id="quoteYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Soft clay ambient occlusion drop shadow -->
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#78590c" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#78590c" flood-opacity="0.08"/>
    </filter>

    <!-- Quotation mark 3D shadow -->
    <filter id="quoteShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#854d0e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1350" fill="url(#clayBg)"/>

  <!-- Organic Fluid Blob Behind Card -->
  <g transform="translate(540, 675) rotate(-22)" opacity="0.9">
    <rect x="-380" y="-380" width="760" height="760" rx="280" fill="url(#blobYellow)"/>
  </g>

  <!-- Puffy Floating 3D White Clay Tile Card in Center -->
  <g filter="url(#clayShadow)">
    <rect x="140" y="190" width="800" height="970" rx="64" fill="#ffffff"/>
    <!-- Subtle top highlight for 3D puffiness -->
    <rect x="144" y="194" width="792" height="962" rx="60" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="6"/>
  </g>

  <!-- Opening 3D Yellow Quotation Marks (Top-Left) -->
  <g transform="translate(195, 220)" filter="url(#quoteShadow)">
    <!-- First Quote -->
    <circle cx="36" cy="36" r="28" fill="url(#quoteYellow)"/>
    <path d="M 52,48 C 52,78 30,88 18,92 C 16,86 20,78 28,72 C 34,66 40,58 40,48 Z" fill="url(#quoteYellow)"/>
    <ellipse cx="28" cy="26" rx="8" ry="5" fill="#ffffff" opacity="0.65" transform="rotate(-30, 28, 26)"/>

    <!-- Second Quote -->
    <g transform="translate(58, 0)">
      <circle cx="36" cy="36" r="28" fill="url(#quoteYellow)"/>
      <path d="M 52,48 C 52,78 30,88 18,92 C 16,86 20,78 28,72 C 34,66 40,58 40,48 Z" fill="url(#quoteYellow)"/>
      <ellipse cx="28" cy="26" rx="8" ry="5" fill="#ffffff" opacity="0.65" transform="rotate(-30, 28, 26)"/>
    </g>
  </g>

  <!-- Closing 3D Yellow Quotation Marks (Bottom-Right) -->
  <g transform="translate(800, 1030) rotate(180, 50, 50)" filter="url(#quoteShadow)">
    <!-- First Quote -->
    <circle cx="36" cy="36" r="28" fill="url(#quoteYellow)"/>
    <path d="M 52,48 C 52,78 30,88 18,92 C 16,86 20,78 28,72 C 34,66 40,58 40,48 Z" fill="url(#quoteYellow)"/>
    <ellipse cx="28" cy="26" rx="8" ry="5" fill="#ffffff" opacity="0.65" transform="rotate(-30, 28, 26)"/>

    <!-- Second Quote -->
    <g transform="translate(58, 0)">
      <circle cx="36" cy="36" r="28" fill="url(#quoteYellow)"/>
      <path d="M 52,48 C 52,78 30,88 18,92 C 16,86 20,78 28,72 C 34,66 40,58 40,48 Z" fill="url(#quoteYellow)"/>
      <ellipse cx="28" cy="26" rx="8" ry="5" fill="#ffffff" opacity="0.65" transform="rotate(-30, 28, 26)"/>
    </g>
  </g>
</svg>
