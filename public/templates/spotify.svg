<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#e8e8ec"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#090a14" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#090a14" flood-opacity="0.06"/>
    </filter>

    <!-- Headphone shadow -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- Doodles outside card -->
  <!-- Fingerprint Heart bottom-left -->
  <g transform="translate(70, 1100) scale(0.85)" opacity="0.35" fill="none" stroke="#27272a" stroke-width="2.5" stroke-linecap="round">
    <path d="M 50,30 C 50,15 35,5 20,20 C 5,35 15,60 50,90 C 85,60 95,35 80,20 C 65,5 50,15 50,30 Z"/>
    <path d="M 50,42 C 48,32 38,20 28,30 C 18,40 25,58 50,80 C 75,58 82,40 72,30 C 62,20 52,32 50,42"/>
    <path d="M 50,54 C 47,48 40,36 34,42 C 28,48 34,60 50,72 C 66,60 72,48 66,42 C 60,36 53,48 50,54"/>
  </g>

  <!-- Sparkle doodles bottom-right -->
  <g transform="translate(940, 1160)" fill="#71717a" opacity="0.65">
    <!-- Star 1 -->
    <path d="M 40,10 Q 40,30 20,30 Q 40,30 40,50 Q 40,30 60,30 Q 40,30 40,10 Z"/>
    <!-- Star 2 -->
    <path d="M 75,50 Q 75,65 60,65 Q 75,65 75,80 Q 75,65 90,65 Q 75,65 75,50 Z" transform="scale(0.8) translate(15, 10)"/>
  </g>

  <!-- Main Floating Card (White rounded card) -->
  <rect x="120" y="160" width="840" height="1030" rx="36" fill="#ffffff" filter="url(#cardShadow)"/>

  <!-- Spotify Branding at Card Bottom -->
  <g transform="translate(170, 1105)">
    <!-- Spotify Logo Circle -->
    <circle cx="26" cy="26" r="26" fill="#1db954"/>
    <!-- Sound Waves -->
    <path d="M 13,20 C 23,17 33,18 40,22" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 15,26 C 23,23 31,24 37,27" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 17,32 C 23,30 29,31 34,33" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Text "Spotify" -->
    <text x="64" y="34" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="22" font-weight="800" fill="#191414" letter-spacing="-0.4">Spotify</text>
  </g>

  <!-- Over-Ear Headphones Clipped Top-Right -->
  <g transform="translate(730, 80)" filter="url(#phoneShadow)">
    <!-- Paperclip holding headphone -->
    <path d="M 120,40 L 120,130 C 120,145 140,145 140,130 L 140,60 C 140,50 155,50 155,60 L 155,140" fill="none" stroke="#71717a" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Headband Arc -->
    <path d="M 40,170 C 40,70 180,60 190,160" fill="none" stroke="#18181b" stroke-width="22" stroke-linecap="round"/>
    <path d="M 40,170 C 40,70 180,60 190,160" fill="none" stroke="#27272a" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Earcup (Back) -->
    <ellipse cx="40" cy="180" rx="28" ry="44" fill="#27272a" transform="rotate(-15, 40, 180)"/>

    <!-- Right Earcup (Front) -->
    <g transform="translate(150, 150) rotate(18, 45, 60)">
      <rect x="15" y="10" width="60" height="95" rx="30" fill="#18181b"/>
      <ellipse cx="45" cy="57" rx="24" ry="40" fill="#27272a"/>
      <ellipse cx="45" cy="57" rx="16" ry="30" fill="#09090b"/>
      <!-- Soft highlight -->
      <path d="M 28,30 C 35,25 55,25 62,30" stroke="rgba(255,255,255,0.25)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
