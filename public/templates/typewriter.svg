<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <!-- Background beige studio -->
    <linearGradient id="twBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8e2d8"/>
    </linearGradient>

    <!-- Paper drop shadow -->
    <filter id="paperShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#2d2218" flood-opacity="0.14"/>
    </filter>

    <!-- Typewriter metallic gradient -->
    <linearGradient id="bodyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93bad4"/>
      <stop offset="40%" stop-color="#76a3c2"/>
      <stop offset="100%" stop-color="#56809e"/>
    </linearGradient>

    <linearGradient id="metalChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="twShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-8" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1350" fill="url(#twBg)"/>

  <!-- Vintage Typing Paper Sheet (Rolling up from typewriter carriage) -->
  <g filter="url(#paperShadow)">
    <path d="M 160,110 Q 540,95 920,110 L 920,950 L 160,950 Z" fill="#faf6ef"/>
    <path d="M 160,110 Q 540,95 920,110 L 920,120 Q 540,105 160,120 Z" fill="#f0ebe0"/>

  </g>

  <!-- Pastel Baby Blue Vintage Typewriter (Anchored at the bottom) -->
  <g transform="translate(0, 890)" filter="url(#twShadow)">
    <!-- Black Platen Roller Cylinder -->
    <rect x="130" y="20" width="820" height="48" rx="8" fill="#18181b"/>
    <!-- Chrome Roller Knobs (Left & Right) -->
    <rect x="80" y="24" width="50" height="40" rx="6" fill="url(#metalChrome)"/>
    <rect x="950" y="24" width="50" height="40" rx="6" fill="url(#metalChrome)"/>

    <!-- Paper Guide Bar (Chrome line holding paper down) -->
    <rect x="150" y="52" width="780" height="10" rx="4" fill="url(#metalChrome)"/>
    <rect x="360" y="47" width="24" height="20" rx="3" fill="#1e293b"/>
    <rect x="696" y="47" width="24" height="20" rx="3" fill="#1e293b"/>

    <!-- Main Typewriter Blue Shell -->
    <path d="M 70,80 L 1010,80 Q 1040,80 1045,110 L 1055,420 Q 1055,455 1020,455 L 60,455 Q 25,455 25,420 L 35,110 Q 40,80 70,80 Z" fill="url(#bodyBlue)"/>

    <!-- Typebar Basket Cutout (Segment where typebars strike) -->
    <path d="M 280,105 L 800,105 L 740,195 L 340,195 Z" fill="#0f172a"/>
    <!-- Typebars metallic spokes -->
    <path d="M 360,190 L 510,120 M 420,190 L 525,120 M 480,190 L 535,120 M 540,190 L 540,120 M 600,190 L 545,120 M 660,190 L 555,120 M 720,190 L 570,120" stroke="#475569" stroke-width="3"/>

    <!-- Ribbon Spool Covers -->
    <circle cx="210" cy="140" r="46" fill="#608ea8"/>
    <circle cx="210" cy="140" r="38" fill="url(#metalChrome)"/>
    <circle cx="870" cy="140" r="46" fill="#608ea8"/>
    <circle cx="870" cy="140" r="38" fill="url(#metalChrome)"/>

    <!-- Chrome Emblem Plate "OMONT" -->
    <rect x="470" y="215" width="140" height="32" rx="6" fill="url(#metalChrome)"/>
    <text x="540" y="238" font-family="'Courier Prime', 'Courier New', monospace" font-size="18" font-weight="900" fill="#1e293b" letter-spacing="3" text-anchor="middle">OMONT</text>

    <!-- Keyboard Recessed Area -->
    <rect x="150" y="265" width="780" height="160" rx="16" fill="#0f172a"/>

    <!-- Rows of Typewriter Keys -->
    <!-- Row 1 -->
    <g transform="translate(190, 280)">
      <circle cx="20" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="85" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="150" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="215" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="280" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="345" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="410" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="475" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="540" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="605" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="670" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(210, 325)">
      <circle cx="20" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="85" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="150" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="215" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="280" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="345" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="410" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="475" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="540" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="605" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
    </g>

    <!-- Row 3 & Spacebar -->
    <g transform="translate(230, 370)">
      <circle cx="20" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="85" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <!-- Spacebar -->
      <rect x="150" y="5" width="310" height="30" rx="8" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="525" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="590" cy="20" r="18" fill="#faf5ea" stroke="#94a3b8" stroke-width="2.5"/>
    </g>
  </g>
</svg>
