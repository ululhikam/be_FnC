<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <!-- Grid notebook pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="1.2"/>
    </pattern>

    <!-- Journal drop shadow -->
    <filter id="journalShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>

    <!-- Brass Clip Metallic Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecd189"/>
      <stop offset="35%" stop-color="#c99738"/>
      <stop offset="70%" stop-color="#8c631e"/>
      <stop offset="100%" stop-color="#dfbb6a"/>
    </linearGradient>

    <!-- Denim Star Pattern -->
    <linearGradient id="denimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f7ba7"/>
      <stop offset="50%" stop-color="#3b6594"/>
      <stop offset="100%" stop-color="#2d4f77"/>
    </linearGradient>
  </defs>

  <!-- Background White Paper with Grid -->
  <rect width="1080" height="1350" fill="#ffffff"/>
  <rect width="1080" height="1350" fill="url(#gridPattern)"/>

  <!-- Tiny cute doodle hearts on grid background -->
  <g fill="#93c5fd" opacity="0.6">
    <path d="M 120,80 C 120,74 114,70 108,76 C 102,82 106,90 120,102 C 134,90 138,82 132,76 C 126,70 120,74 120,80 Z"/>
    <path d="M 940,240 C 940,234 934,230 928,236 C 922,242 926,250 940,262 C 954,250 958,242 952,236 C 946,230 940,234 940,240 Z"/>
  </g>
  <g fill="#f472b6" opacity="0.5">
    <path d="M 980,1200 C 980,1194 974,1190 968,1196 C 962,1202 966,1210 980,1222 C 994,1210 998,1202 992,1196 C 986,1190 980,1194 980,1200 Z"/>
    <path d="M 80,1120 C 80,1114 74,1110 68,1116 C 62,1122 66,1130 80,1142 C 94,1130 98,1122 92,1116 C 86,1110 80,1114 80,1120 Z"/>
  </g>

  <!-- Open Hardcover Journal Book in Center -->
  <g filter="url(#journalShadow)">
    <!-- Book Black Cover Rim -->
    <rect x="110" y="140" width="860" height="1070" rx="20" fill="#1e293b"/>

    <!-- Open White Pages -->
    <rect x="118" y="148" width="844" height="1054" rx="16" fill="#fcfcfc"/>

    <!-- Center Fold Crease Line / Shadow -->
    <line x1="540" y1="148" x2="540" y2="1202" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="532" y="148" width="16" height="1054" fill="black" opacity="0.03"/>
  </g>

  <!-- Denim Star Patch (Top Right Corner) -->
  <g transform="translate(805, 175) rotate(15)">
    <!-- Denim Base -->
    <path d="M 50,5 L 64,36 L 98,39 L 72,62 L 80,95 L 50,77 L 20,95 L 28,62 L 2,39 L 36,36 Z" fill="url(#denimGrad)"/>
    <!-- Stitched Thread Outline -->
    <path d="M 50,11 L 62,38 L 91,41 L 68,61 L 75,90 L 50,74 L 25,90 L 32,61 L 9,41 L 38,38 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5,4" stroke-linecap="round"/>
  </g>

  <!-- Denim Star Patch (Bottom Left Corner) -->
  <g transform="translate(130, 1025) rotate(-12)">
    <!-- Denim Base -->
    <path d="M 50,5 L 64,36 L 98,39 L 72,62 L 80,95 L 50,77 L 20,95 L 28,62 L 2,39 L 36,36 Z" fill="url(#denimGrad)"/>
    <!-- Stitched Thread Outline -->
    <path d="M 50,11 L 62,38 L 91,41 L 68,61 L 75,90 L 50,74 L 25,90 L 32,61 L 9,41 L 38,38 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="5,4" stroke-linecap="round"/>
  </g>

  <!-- Brass Wire Bulldog Clip (Top Center) -->
  <g transform="translate(490, 85)">
    <!-- Clip Body -->
    <rect x="15" y="45" width="70" height="35" rx="5" fill="url(#brassGrad)"/>
    <!-- Wire Loop Up -->
    <path d="M 30,50 L 30,15 C 30,5 70,5 70,15 L 70,50" fill="none" stroke="url(#brassGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="50" cy="15" r="10" fill="none" stroke="url(#brassGrad)" stroke-width="6"/>
  </g>

  <!-- Brass Wire Bulldog Clip (Bottom Center) -->
  <g transform="translate(490, 1180)">
    <!-- Clip Body -->
    <rect x="15" y="5" width="70" height="35" rx="5" fill="url(#brassGrad)"/>
    <!-- Wire Loop Down -->
    <path d="M 30,35 L 30,70 C 30,80 70,80 70,70 L 70,35" fill="none" stroke="url(#brassGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="50" cy="70" r="10" fill="none" stroke="url(#brassGrad)" stroke-width="6"/>
  </g>
</svg>
